<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>AXON — الأقسام والتلاميذ</title>
<style>
  body{margin:0;background:#0f1420;color:#e8ebf3;font-family:Tahoma,Arial,sans-serif;padding:24px 16px;}
  h1{text-align:center;font-size:1.4rem;}
  table{width:100%;max-width:700px;margin:20px auto;border-collapse:collapse;}
  th,td{padding:8px;border-bottom:1px solid #232c42;text-align:right;}
  th{color:#8a93a8;}
</style>
</head>
<body>
<h1>AXON — الأقسام والتلاميذ</h1>
<table id="sectionsTable"><tbody><tr><td>جاري التحميل...</td></tr></tbody></table>
<table id="personsTable"><tbody><tr><td>جاري التحميل...</td></tr></tbody></table>

<script>
window.onerror = function(msg){ alert('خطأ: ' + msg); };

const SB_URL="https://tmizzjieyeqbcxuxoucw.supabase.co";
const SB_KEY="sb_publishable_0MXFCqGLOeqkteVozjLtDQ_VCmGeXhM";
const H={"apikey":SB_KEY,"Authorization":"Bearer "+SB_KEY};

fetch(SB_URL+"/rest/v1/sections?select=*",{headers:H})
  .then(r=>r.json())
  .then(d=>{
    let html="<tr><th>القسم</th><th>الأستاذ</th><th>العدد</th></tr>";
    d.forEach(s=>html+=`<tr><td>${s.name}</td><td>${s.teacher_name}</td><td>${s.student_count}</td></tr>`);
    document.getElementById('sectionsTable').innerHTML=html;
  })
  .catch(e=>alert('خطأ بالأقسام: '+e.message));

fetch(SB_URL+"/rest/v1/persons?select=full_name,role",{headers:H})
  .then(r=>r.json())
  .then(d=>{
    let html="<tr><th>الاسم</th><th>الصفة</th></tr>";
    d.forEach(p=>html+=`<tr><td>${p.full_name}</td><td>${p.role}</td></tr>`);
    document.getElementById('personsTable').innerHTML=html;
  })
  .catch(e=>alert('خطأ بالتلاميذ: '+e.message));
</script>
</body>
</html>
