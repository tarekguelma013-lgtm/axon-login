<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>AXON Test</title>
<style>
body{margin:0;background:#0f1420;color:#e8ebf3;font-family:Tahoma,Arial,sans-serif;padding:24px 16px;}
table{width:100%;max-width:700px;margin:20px auto;border-collapse:collapse;}
th,td{padding:8px;border-bottom:1px solid #232c42;text-align:right;}
th{color:#8a93a8;}
</style>
</head>
<body>
<h1>AXON Test</h1>
<div id="out">جاري الفحص...</div>
<table id="t1"></table>
<table id="t2"></table>

<script>
var URL = "https://tmizzjieyeqbcxuxoucw.supabase.co";
var KEY = "sb_publishable_0MXFCqGL0eqkteVozjLtDQ_VCmGeXhM";

document.getElementById('out').innerHTML = "طول المفتاح: " + KEY.length + " حرف";

var H = { "apikey": KEY, "Authorization": "Bearer " + KEY };

fetch(URL + "/rest/v1/sections?select=*", { headers: H })
  .then(function(r){ return r.text(); })
  .then(function(text){
    document.getElementById('t1').innerHTML = "<tr><td>نتيجة sections:</td></tr><tr><td>" + text + "</td></tr>";
  })
  .catch(function(e){
    document.getElementById('t1').innerHTML = "خطأ: " + e.message;
  });

fetch(URL + "/rest/v1/persons?select=*", { headers: H })
  .then(function(r){ return r.text(); })
  .then(function(text){
    document.getElementById('t2').innerHTML = "<tr><td>نتيجة persons:</td></tr><tr><td>" + text + "</td></tr>";
  })
  .catch(function(e){
    document.getElementById('t2').innerHTML = "خطأ: " + e.message;
  });
</script>
</body>
</html>
