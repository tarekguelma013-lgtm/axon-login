<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AXON — بوابة الدخول</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Zilla+Slab:wght@500;600;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#14171c; --ink-2:#1b1f26; --ink-3:#232833;
    --brass:#b08d57; --brass-bright:#d4ac6e;
    --paper:#ece7dc; --slate:#7d8493;
    --ok:#5c9179; --err:#b0654f; --radius:14px;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    background: radial-gradient(1200px 800px at 50% -10%, #1e2430 0%, var(--ink) 55%), var(--ink);
    color:var(--paper); font-family:'IBM Plex Sans Arabic', sans-serif;
    min-height:100vh; display:flex; align-items:center; justify-content:center;
    padding:24px 16px; -webkit-font-smoothing:antialiased;
  }
  .wrap{ max-width:420px; width:100%; }
  .brand{ text-align:center; margin-bottom:20px; }
  .brand h1{ font-family:'Zilla Slab', serif; font-weight:700; font-size:2rem; }
  .brand h1 span{ color:var(--brass-bright); }
  .brand p{ color:var(--slate); font-size:0.85rem; margin-top:6px; }

  .tabs{ display:flex; gap:6px; margin-bottom:14px; background:var(--ink-2); border:1px solid var(--ink-3); border-radius:10px; padding:4px; }
  .tab{
    flex:1; text-align:center; padding:9px 4px; font-size:0.8rem; border-radius:7px;
    cursor:pointer; color:var(--slate); font-family:inherit;
  }
  .tab.active{ background:var(--ink-3); color:var(--paper); font-weight:600; }

  .card{
    background:var(--ink-2); border:1px solid var(--ink-3); border-radius:var(--radius);
    padding:24px; box-shadow:0 12px 30px -18px rgba(0,0,0,.5);
  }
  .step-title{ font-family:'Zilla Slab', serif; font-size:1.15rem; margin-bottom:4px; }
  .step-sub{ font-size:0.82rem; color:var(--slate); margin-bottom:18px; }

  .field{ margin-bottom:12px; }
  .field label{ display:block; font-size:0.8rem; margin-bottom:6px; color:var(--slate); }
  .field input{
    width:100%; background:var(--ink); border:1px solid var(--ink-3); border-radius:9px;
    padding:11px 12px; color:var(--paper); font-family:inherit; font-size:0.92rem;
  }
  .field input:focus{ outline:none; border-color:var(--brass); }

  .btn{
    width:100%; padding:12px; border-radius:9px; border:none; font-weight:600;
    font-family:inherit; font-size:0.92rem; cursor:pointer; margin-top:6px;
    background:linear-gradient(180deg, var(--brass-bright), var(--brass)); color:#14171c;
  }
  .btn:disabled{ opacity:0.6; }
  .btn.ghost{ background:none; border:1px solid var(--ink-3); color:var(--slate); }
  .btn:active{ transform:scale(.98); }

  .msg{ margin-top:12px; font-size:0.8rem; padding:9px 11px; border-radius:8px; display:none; }
  .msg.show{ display:block; }
  .msg.ok{ background:rgba(92,145,121,.15); color:#9fd2b8; }
  .msg.err{ background:rgba(176,101,79,.15); color:#e3a794; }

  .panel{ display:none; }
  .panel.active{ display:block; }

  .qr-box{ text-align:center; background:var(--ink); border:1px dashed var(--ink-3); border-radius:10px; padding:20px; margin-bottom:12px; }
  .qr-token{ font-family:monospace; font-size:0.95rem; letter-spacing:2px; margin:8px 0; word-break:break-all; }
  .qr-timer{ font-size:0.75rem; color:var(--slate); }

  .success{ text-align:center; }
  .success .icon{ font-size:2.4rem; margin-bottom:10px; }

  .footer-note{ text-align:center; font-size:0.72rem; color:var(--slate); margin-top:16px; }
</style>
</head>
<body>

<div class="wrap">
  <div class="brand">
    <h1>AX<span>ON</span></h1>
    <p>بوابة دخول جديدة ومستقلة</p>
  </div>

  <div class="tabs">
    <div class="tab active" data-tab="password">كلمة السر</div>
    <div class="tab" data-tab="biometric">البصمة</div>
    <div class="tab" data-tab="qr">رمز QR</div>
  </div>

  <div class="card">

    <!-- تبويب: كلمة السر -->
    <div class="panel active" id="panelPassword">
      <div class="step-title">تسجيل الدخول بكلمة السر</div>
      <div class="step-sub">أدخل بريدك وكلمة السر الخاصة بحسابك.</div>

      <div class="field">
        <label>البريد الإلكتروني</label>
        <input type="email" id="pwEmail" placeholder="name@example.com" autocomplete="email">
      </div>
      <div class="field">
        <label>كلمة السر</label>
        <input type="password" id="pwPassword" placeholder="••••••••" autocomplete="current-password">
      </div>

      <button class="btn" id="btnPassword">دخول</button>
      <div class="msg" id="msgPassword"></div>
    </div>

    <!-- تبويب: البصمة -->
    <div class="panel" id="panelBiometric">
      <div class="step-title">تسجيل الدخول بالبصمة</div>
      <div class="step-sub">أدخل بريدك، ثم أكّد هويتك ببصمتك أو Face ID.</div>

      <div class="field">
        <label>البريد الإلكتروني</label>
        <input type="email" id="bioEmail" placeholder="name@example.com" autocomplete="email">
      </div>

      <button class="btn" id="btnBiometric">التحقق بالبصمة الآن</button>
      <div class="msg" id="msgBiometric"></div>
    </div>

    <!-- تبويب: QR -->
    <div class="panel" id="panelQr">
      <div class="step-title">الدخول عبر رمز QR</div>
      <div class="step-sub">أدخل بريدك لتوليد رمز الدخول.</div>

      <div class="field">
        <label>البريد الإلكتروني</label>
        <input type="email" id="qrEmail" placeholder="name@example.com" autocomplete="email">
      </div>

      <button class="btn" id="btnQrGenerate">توليد رمز QR</button>

      <div class="qr-box" id="qrBox" style="display:none;">
        <div class="qr-token" id="qrTokenDisplay">—</div>
        <div class="qr-timer" id="qrTimer">—</div>
      </div>

      <div class="msg" id="msgQr"></div>
    </div>

    <!-- نجاح -->
    <div class="panel success" id="panelSuccess">
      <div class="icon">✓</div>
      <div class="step-title">تم التحقق من هويتك</div>
      <div class="step-sub">مرحبًا بعودتك إلى AXON.</div>
    </div>

  </div>


</div>

<script src="https://cdn.jsdelivr.net/npm/@simplewebauthn/browser@10/dist/bundle/index.umd.min.js"></script>
<script>
const SUPABASE_URL = "https://tmizzjieyeqbcxuxoucw.supabase.co";
const ANON_KEY = "sb_publishable_0MXFCqGL0eqkteVozjLtDQ_VCmGeXhM";

const REAL_SLUGS = {
  "login-password": "rapid-responder",
  "login-biometric-options": "smart-endpoint",
  "login-biometric-verify": "rapid-api",
  "login-qr-generate": "swift-api",
};

function fn(name){
  const slug = REAL_SLUGS[name] || name;
  return `${SUPABASE_URL}/functions/v1/${slug}`;
}
function headers(){
  return {
    "Content-Type": "application/json",
    "Authorization": `Bearer ${ANON_KEY}`,
    "apikey": ANON_KEY
  };
}

function showMsg(id, text, type){
  const el = document.getElementById(id);
  el.textContent = text;
  el.className = 'msg show ' + type;
}

function showPanel(id){
  document.querySelectorAll('.panel').forEach(p=>{
    p.className = 'panel' + (p.id === id ? ' active' : '') + (p.id === 'panelSuccess' ? ' success' : '');
  });
}

function goToDashboard(uid){
  sessionStorage.setItem('axon_user_id', uid);
  showPanel('panelSuccess');
  setTimeout(()=>{ window.location.href = `axon-account.html?uid=${uid}`; }, 1100);
}

// ===== تبديل التبويبات =====
document.querySelectorAll('.tab').forEach(tab=>{
  tab.addEventListener('click', ()=>{
    document.querySelectorAll('.tab').forEach(t=> t.className = 'tab');
    tab.className = 'tab active';
    const map = { password:'panelPassword', biometric:'panelBiometric', qr:'panelQr' };
    showPanel(map[tab.dataset.tab]);
  });
});

// ===== كلمة السر =====
document.getElementById('btnPassword').addEventListener('click', async ()=>{
  const email = document.getElementById('pwEmail').value.trim();
  const password = document.getElementById('pwPassword').value;
  if(!email || !password){
    showMsg('msgPassword','أدخل البريد وكلمة السر أولًا.','err');
    return;
  }
  const btn = document.getElementById('btnPassword');
  btn.disabled = true; btn.textContent = 'جاري التحقق...';

  try{
    const res = await fetch(fn('login-password'), {
      method:'POST', headers: headers(),
      body: JSON.stringify({ email, password })
    });
    const data = await res.json();

    if(data.success){
      goToDashboard(data.user_id);
      return;
    }
    if(data.locked){
      showMsg('msgPassword', data.error, 'err');
      return;
    }
    showMsg('msgPassword', data.error || 'كلمة السر غير صحيحة.', 'err');
  }catch(e){
    showMsg('msgPassword','تعذر الاتصال بالسيرفر.','err');
  }finally{
    btn.disabled = false; btn.textContent = 'دخول';
  }
});

// ===== البصمة (بالإيميل) =====
document.getElementById('btnBiometric').addEventListener('click', async ()=>{
  const email = document.getElementById('bioEmail').value.trim();
  if(!email){
    showMsg('msgBiometric','أدخل بريدك أولًا.','err');
    return;
  }
  const btn = document.getElementById('btnBiometric');
  btn.disabled = true; btn.textContent = 'جاري التحقق...';

  try{
    if(!window.PublicKeyCredential){
      showMsg('msgBiometric','هذا الجهاز/المتصفح لا يدعم البصمة (WebAuthn).','err');
      return;
    }

    const optRes = await fetch(fn('login-biometric-options'), {
      method:'POST', headers: headers(),
      body: JSON.stringify({ email })
    });
    const options = await optRes.json();
    if(options.error){
      showMsg('msgBiometric', options.error, 'err');
      return;
    }

    const userId = options.user_id;
    const authResp = await SimpleWebAuthnBrowser.startAuthentication(options);

    const verifyRes = await fetch(fn('login-biometric-verify'), {
      method:'POST', headers: headers(),
      body: JSON.stringify({ user_id: userId, assertion_response: authResp })
    });
    const verifyData = await verifyRes.json();

    if(verifyData.success){
      goToDashboard(userId);
      return;
    }
    showMsg('msgBiometric', verifyData.error || 'فشل التحقق من البصمة.', 'err');
  }catch(e){
    showMsg('msgBiometric', `تعذّر بدء التحقق: ${e.name || ''} — ${e.message || 'غير معروف'}`, 'err');
  }finally{
    btn.disabled = false; btn.textContent = 'التحقق بالبصمة الآن';
  }
});

// ===== QR =====
let qrCountdownTimer = null;

document.getElementById('btnQrGenerate').addEventListener('click', async ()=>{
  const email = document.getElementById('qrEmail').value.trim();
  if(!email){
    showMsg('msgQr','أدخل بريدك أولًا.','err');
    return;
  }
  const btn = document.getElementById('btnQrGenerate');
  btn.disabled = true; btn.textContent = 'جاري التوليد...';

  try{
    const res = await fetch(fn('login-qr-generate'), {
      method:'POST', headers: headers(),
      body: JSON.stringify({ email })
    });
    const data = await res.json();

    if(data.error){
      showMsg('msgQr', data.error, 'err');
      return;
    }

    document.getElementById('qrBox').style.display = 'block';
    document.getElementById('qrTokenDisplay').textContent = data.token;
    startQrCountdown(data.expires_in_seconds);
  }catch(e){
    showMsg('msgQr','تعذر الاتصال بالسيرفر.','err');
  }finally{
    btn.disabled = false; btn.textContent = 'توليد رمز QR';
  }
});

function startQrCountdown(seconds){
  clearInterval(qrCountdownTimer);
  let remaining = seconds;
  const timerEl = document.getElementById('qrTimer');
  timerEl.textContent = `تنتهي الصلاحية خلال ${remaining} ثانية`;
  qrCountdownTimer = setInterval(()=>{
    remaining--;
    if(remaining <= 0){
      clearInterval(qrCountdownTimer);
      timerEl.textContent = 'انتهت صلاحية الرمز';
      return;
    }
    timerEl.textContent = `تنتهي الصلاحية خلال ${remaining} ثانية`;
  }, 1000);
}
</script>
</body>
</html>
